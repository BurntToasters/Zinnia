[advisories]
# Both ignored advisories are "unmaintained" or "unsound" warnings (not
# vulnerabilities) from transitive dependencies pulled in by Tauri v2 / wry /
# webkit2gtk. They are not directly controllable from this crate.
# Plain `cargo audit` still fails on any new advisory in any other crate.
# scripts/check-rustsec-ignore-policy.mjs makes this exact reviewed set expire
# on 2027-03-01 so transitive debt cannot become a permanent silent allowlist.
# Reviewed 2026-10-13: the gtk-rs GTK3 advisories (RUSTSEC-2024-0411..0420)
# were withdrawn upstream and the unic-* crates (RUSTSEC-2025-0075, -0080,
# -0081, -0098, -0100) are no longer in Cargo.lock, so those ignores were removed.
ignore = [
    # glib VariantStrIter unsoundness (not reached by this app)
    "RUSTSEC-2024-0429",
    # proc-macro-error unmaintained (transitive build dep)
    "RUSTSEC-2024-0370",
]
