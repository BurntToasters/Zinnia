app-id: run.rosie.zinnia
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: zinnia
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Broad FS access is intentional for a file archiver: the 7z sidecar must
  # read/write user-selected paths. Portals alone are not enough today.
  # See SECURITY.md "Flatpak filesystem access".
  - --filesystem=home

environment:
  GTK_USE_PORTAL: "1"

modules:
  - name: zinnia
    buildsystem: simple
    build-options:
      # npm and Cargo fetch only integrity-locked dependencies. Application
      # sources come from the clean commit export prepared by the host script.
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/zinnia/cargo
        RUSTUP_HOME: /run/build/zinnia/rustup
        npm_config_cache: /run/build/zinnia/npm-cache
        HUSKY: "0"
        RUSTUP_TOOLCHAIN: stable
    build-commands:
      - npm ci
      - npm run sync-version
      - npm run prepare:7z:all
      - npm run licenses
      - npm run build
      - npx tauri build --no-bundle -- --locked
      - install -Dm755 src-tauri/target/release/zinnia /app/bin/zinnia
      - if [ "$FLATPAK_ARCH" = "aarch64" ]; then install -Dm755 src-tauri/binaries/7z-aarch64-unknown-linux-gnu /app/bin/7z-aarch64-unknown-linux-gnu; else install -Dm755 src-tauri/binaries/7z-x86_64-unknown-linux-gnu /app/bin/7z-x86_64-unknown-linux-gnu; fi
      - install -Dm644 run.rosie.zinnia.desktop /app/share/applications/run.rosie.zinnia.desktop
      - install -Dm644 run.rosie.zinnia.metainfo.xml /app/share/metainfo/run.rosie.zinnia.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/run.rosie.zinnia.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/run.rosie.zinnia.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/run.rosie.zinnia.png
    sources:
      - type: dir
        path: .flatpak-source
        skip:
          - .git
          - .github
          - .agents
          - .codex
          - .env
          - .env.*
          - node_modules
          - src-tauri/target
          - dist
          - release
          - flatpak-build
          - flatpak-repo
