name: CI

# Note: CI workflows are only run on the main and beta branches.
# Additionally, CI workflows only run tests and smoke runs, not actually release builds.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm run test:all

  rust-check:
    needs: quality-gate
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run test:cov
      - run: npm run prepare:7z
      # Empty stubs only — CI never builds/signs the real Win11 shell package.
      - run: npm run prepare:win-shell-stubs
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  updater-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12
      - run: npm run validate:updater

  # Unsigned compile smoke only — not a release. Signed NSIS/DMG/AppImage stay on build VMs.
  smoke-build:
    needs: quality-gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sidecar: 7z-x86_64-unknown-linux-gnu
            binary: zinnia
          - os: macos-latest
            sidecar: 7z-aarch64-apple-darwin
            binary: zinnia
          - os: windows-latest
            sidecar: 7z-x86_64-pc-windows-msvc.exe
            binary: zinnia.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm run sync-version
      - run: npm run prepare:7z
      - run: npm run licenses
      - run: npm run build
      - run: npm run prepare:win-shell-stubs
      - name: Unsigned tauri build (no bundle)
        run: npx tauri build --no-bundle
      - name: Verify host sidecar and smoke binary
        shell: bash
        run: |
          test -e "src-tauri/binaries/${{ matrix.sidecar }}"
          test -e "src-tauri/target/release/${{ matrix.binary }}"

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - run: npm run prepare:7z
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
