name: 7-Zip watch

# Weekly read-only check for a newer official 7-Zip release. A newer release
# opens one issue with the update steps. Nothing is downloaded or committed here.

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"

jobs:
  check-7z:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - run: npm ci --ignore-scripts
      - name: Check for a newer official 7-Zip
        id: check
        run: |
          set -euo pipefail
          node scripts/update-7z.js --check --json > "$RUNNER_TEMP/7z-check.json"
          cat "$RUNNER_TEMP/7z-check.json"
          # Validate the JSON before any value reaches a shell or an issue title.
          node -e '
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          // Whole-string match without a regex end anchor (keeps "$" out of
          // this single-quoted script).
          const isVersion = (value) =>
            typeof value === "string" && /^\d+\.\d+/.exec(value)?.[0] === value;
          if (
            !isVersion(result.current) ||
            !isVersion(result.latest) ||
            typeof result.updateAvailable !== "boolean"
          ) {
            throw new Error("Unexpected update-7z --check --json output.");
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              "current=" + result.current,
              "latest=" + result.latest,
              "update_available=" + String(result.updateAvailable),
              "",
            ].join("\n"),
          );
          ' "$RUNNER_TEMP/7z-check.json"
      - name: Open issue for a newer 7-Zip
        if: steps.check.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail
          title="7-Zip ${LATEST} available"
          # Only an OPEN issue suppresses a new one. Exact title match, not the
          # search ranking, decides whether one already exists.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "in:title \"${title}\"" \
            --json title --jq "[.[] | select(.title == \"${title}\")] | length")
          if [ "$existing" != "0" ]; then
            echo "Open issue already exists: ${title}"
            exit 0
          fi
          body_file="$RUNNER_TEMP/7z-issue-body.md"
          {
            cat <<'EOF'
          Official 7-Zip is newer than the bundled copy in this repository.

          Check output from `node scripts/update-7z.js --check --json`:

          ```json
          EOF
            cat "$RUNNER_TEMP/7z-check.json"
            cat <<'EOF'
          ```

          Update steps:

          1. Start from the release branch and run `npm ci --ignore-scripts`.
          2. Use a trusted 7-Zip extractor (for example `7zz` from https://www.7-zip.org/download.html) and run:

             npm run 7z:update -- --trusted-7z <path>

          3. Review the diff in `assets/`, `CHANGELOG.md`, and `src-tauri/binaries/`. Confirm `assets/7z-provenance.json` lists `url` and `mirrorUrl` for every archive, and that the bundled version matches the title.
          4. Run the normal release checks and open a PR. Close this issue when the update lands.
          EOF
          } > "$body_file"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
