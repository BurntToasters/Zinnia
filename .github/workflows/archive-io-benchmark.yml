name: Archive I/O benchmark

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch, tag, or commit to measure
        required: true
        default: beta
        type: string
      baseline_ref:
        description: Baseline branch, tag, or commit to compare
        required: true
        default: main
        type: string

concurrency:
  group: archive-io-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "stable"

jobs:
  archive-io-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar: 7z-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            sidecar: 7z-aarch64-unknown-linux-gnu
          - os: macos-26
            sidecar: 7z-aarch64-apple-darwin
          - os: macos-26-intel
            sidecar: 7z-x86_64-apple-darwin
          - os: windows-latest
            sidecar: 7z-x86_64-pc-windows-msvc.exe
          - os: windows-11-arm
            sidecar: 7z-aarch64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    # Release-sized candidate+baseline runs cover six platforms, multiple formats,
    # every operation, and compatibility fixtures. Use GitHub's hosted-job maximum
    # so a slow ARM or macOS runner can finish and publish its correctness report.
    # Timing remains report-only; correctness and verification failures still fail.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_ref || 'beta' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci --ignore-scripts
      - run: npm run prepare:7z
      - name: Prepare Windows shell stubs
        if: runner.os == 'Windows'
        run: npm run prepare:win-shell-stubs
      - name: Archive I/O candidate release benchmark
        env:
          ZINNIA_BENCH_REPORT_DIR: ${{ runner.temp }}/zinnia-archive-io
          ZINNIA_BENCH_CANDIDATE_REF: ${{ inputs.candidate_ref || 'beta' }}
          ZINNIA_BENCH_BASELINE_REF: ${{ inputs.baseline_ref || 'main' }}
          ZINNIA_BENCH_BASE_REF: ${{ inputs.baseline_ref || 'main' }}
          ZINNIA_BENCH_BASE_RUN: "1"
          ZINNIA_BENCH_REQUIRE_CANDIDATE: "1"
          ZINNIA_BENCH_REQUIRE_BASELINE: "0"
        run: >-
          npm run benchmark:archive-io --
          --formats zip,7z,tar,gzip,bzip2,xz
          --workloads bulk,small
          --operation-formats zip,7z,tar
          --operation-workloads bulk,small
          --scale release
          --compatibility
      - name: Upload archive I/O release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-io-release-${{ matrix.os }}
          path: ${{ runner.temp }}/zinnia-archive-io
          if-no-files-found: error
          retention-days: 90
