name: Archive I/O benchmark

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch, tag, or commit to measure
        required: true
        default: beta
        type: string
      baseline_ref:
        description: Baseline branch, tag, or commit to compare
        required: true
        default: main
        type: string

concurrency:
  group: archive-io-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "1.98.1"

jobs:
  archive-io-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar: 7z-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            sidecar: 7z-aarch64-unknown-linux-gnu
          - os: macos-26
            sidecar: 7z-aarch64-apple-darwin
          - os: macos-26-intel
            sidecar: 7z-x86_64-apple-darwin
          - os: windows-latest
            sidecar: 7z-x86_64-pc-windows-msvc.exe
          - os: windows-11-arm
            sidecar: 7z-aarch64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    # Release-sized candidate+baseline runs cover six platforms, multiple formats,
    # every operation, and compatibility fixtures. Use GitHub's hosted-job maximum
    # so a slow ARM or macOS runner can finish and publish its correctness report.
    # Timing remains report-only; correctness and verification failures still fail.
    timeout-minutes: 360
    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_ref || 'beta' }}
          fetch-depth: 0
          persist-credentials: false
      - id: setup_node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: install_npm
        name: Install pinned npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - id: rust_toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - id: linux_deps
        name: Install Linux E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - id: npm_ci
        run: npm ci --ignore-scripts
      - id: prepare_7z
        run: npm run prepare:7z
      - id: windows_shell_stubs
        name: Prepare Windows shell stubs
        if: runner.os == 'Windows'
        run: npm run prepare:win-shell-stubs
      - id: benchmark
        name: Archive I/O candidate release benchmark
        env:
          ZINNIA_BENCH_REPORT_DIR: ${{ runner.temp }}/zinnia-archive-io
          ZINNIA_BENCH_CANDIDATE_REF: ${{ inputs.candidate_ref || 'beta' }}
          ZINNIA_BENCH_EXPECTED_CANDIDATE_REVISION: ${{ steps.checkout.outputs.commit }}
          ZINNIA_BENCH_BASELINE_REF: ${{ inputs.baseline_ref || 'main' }}
          ZINNIA_BENCH_BASE_REF: ${{ inputs.baseline_ref || 'main' }}
          ZINNIA_BENCH_BASE_RUN: "1"
          ZINNIA_BENCH_REQUIRE_CANDIDATE: "1"
          ZINNIA_BENCH_REQUIRE_BASELINE: "0"
          ZINNIA_BENCH_RUN_TIMEOUT_MS: "10800000"
          ZINNIA_BENCH_COMMAND_TIMEOUT_MS: "1800000"
          ZINNIA_BENCH_BUILD_TIMEOUT_MS: "5400000"
        run: >-
          npm run benchmark:archive-io --
          --formats zip,7z,tar,gzip,bzip2,xz
          --workloads bulk,small
          --operation-formats zip,7z,tar
          --operation-workloads bulk,small
          --scale release
          --compatibility
      # always() cannot run after hard runner loss or hard cancellation.
      - name: Write archive benchmark setup diagnostics
        if: always()
        shell: pwsh
        env:
          ZINNIA_BENCH_REPORT_DIR: ${{ runner.temp }}/zinnia-archive-io
          DIAG_RUN_ID: ${{ github.run_id }}
          DIAG_RUN_ATTEMPT: ${{ github.run_attempt }}
          DIAG_EVENT_NAME: ${{ github.event_name }}
          DIAG_RUNNER_OS: ${{ runner.os }}
          DIAG_RUNNER_IMAGE: ${{ matrix.os }}
          DIAG_GITHUB_SHA: ${{ github.sha }}
          DIAG_CANDIDATE_REF: ${{ inputs.candidate_ref || 'beta' }}
          DIAG_BASELINE_REF: ${{ inputs.baseline_ref || 'main' }}
          DIAG_CHECKOUT_COMMIT: ${{ steps.checkout.outputs.commit }}
          DIAG_CHECKOUT: ${{ steps.checkout.outcome }}
          DIAG_SETUP_NODE: ${{ steps.setup_node.outcome }}
          DIAG_INSTALL_NPM: ${{ steps.install_npm.outcome }}
          DIAG_RUST_TOOLCHAIN: ${{ steps.rust_toolchain.outcome }}
          DIAG_LINUX_DEPS: ${{ steps.linux_deps.outcome }}
          DIAG_NPM_CI: ${{ steps.npm_ci.outcome }}
          DIAG_PREPARE_7Z: ${{ steps.prepare_7z.outcome }}
          DIAG_WINDOWS_STUBS: ${{ steps.windows_shell_stubs.outcome }}
          DIAG_BENCHMARK: ${{ steps.benchmark.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDir = $env:ZINNIA_BENCH_REPORT_DIR
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $steps = [ordered]@{
            checkout = $env:DIAG_CHECKOUT
            setupNode = $env:DIAG_SETUP_NODE
            installNpm = $env:DIAG_INSTALL_NPM
            rustToolchain = $env:DIAG_RUST_TOOLCHAIN
            linuxDependencies = $env:DIAG_LINUX_DEPS
            npmCi = $env:DIAG_NPM_CI
            prepare7z = $env:DIAG_PREPARE_7Z
            windowsShellStubs = $env:DIAG_WINDOWS_STUBS
            benchmark = $env:DIAG_BENCHMARK
          }
          $failedSteps = @($steps.GetEnumerator() | Where-Object { $_.Value -eq 'failure' } | ForEach-Object { $_.Key })
          $status = if ($failedSteps.Count -gt 0) { 'failed' } elseif ($env:DIAG_BENCHMARK -eq 'success') { 'completed' } else { 'incomplete' }
          $report = [ordered]@{
            schemaVersion = 1
            workflow = 'archive-io-benchmark'
            status = $status
            generatedAtUtc = [DateTime]::UtcNow.ToString('o')
            runId = $env:DIAG_RUN_ID
            runAttempt = $env:DIAG_RUN_ATTEMPT
            event = $env:DIAG_EVENT_NAME
            runnerOs = $env:DIAG_RUNNER_OS
            runnerImage = $env:DIAG_RUNNER_IMAGE
            githubSha = $env:DIAG_GITHUB_SHA
            candidateRef = $env:DIAG_CANDIDATE_REF
            candidateRevision = $env:DIAG_CHECKOUT_COMMIT
            baselineRef = $env:DIAG_BASELINE_REF
            steps = $steps
            failedSteps = $failedSteps
          }
          $jsonPath = Join-Path $reportDir 'archive-io-setup-diagnostics.json'
          $logPath = Join-Path $reportDir 'archive-io-setup-diagnostics.log'
          $report | ConvertTo-Json -Depth 8 | Set-Content -Path $jsonPath -Encoding utf8
          @(
            "status=$status"
            "runId=$($env:DIAG_RUN_ID)"
            "runner=$($env:DIAG_RUNNER_IMAGE)"
            "candidate=$($env:DIAG_CANDIDATE_REF) revision=$($env:DIAG_CHECKOUT_COMMIT)"
            "steps=$($steps | ConvertTo-Json -Compress)"
            "failedSteps=$($failedSteps -join ',')"
          ) | Set-Content -Path $logPath -Encoding utf8
          if ((Get-Item $jsonPath).Length -eq 0 -or (Get-Item $logPath).Length -eq 0) {
            throw 'Archive benchmark setup diagnostics were empty.'
          }
      - name: Upload archive I/O release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-io-release-${{ matrix.os }}
          path: ${{ runner.temp }}/zinnia-archive-io
          if-no-files-found: error
          retention-days: 90
