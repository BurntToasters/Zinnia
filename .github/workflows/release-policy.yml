name: Release policy

# This workflow is loaded from main. It inspects PR commits only as Git data;
# never check out, install dependencies from, or execute a PR head here.
on:
  pull_request_target:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        edited,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  evaluate-release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Start source-bound release-policy check
        id: policy_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const headSha = pullRequest?.head?.sha;
            if (
              pullRequest?.base?.ref !== "main" ||
              pullRequest?.base?.repo?.full_name?.toLowerCase() !== repository.toLowerCase() ||
              !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/iu.test(String(headSha || "")) ||
              !Number.isSafeInteger(pullRequest.number) ||
              pullRequest.number <= 0
            ) {
              throw new Error("Cannot publish release-policy check for an unbound pull request.");
            }
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "release-policy",
              head_sha: headSha,
              status: "in_progress",
              external_id: `${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}:${pullRequest.number}`,
              details_url: `${process.env.GITHUB_SERVER_URL}/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              started_at: new Date().toISOString(),
            });
            if (
              !Number.isSafeInteger(data.id) ||
              data.id <= 0 ||
              data.name !== "release-policy" ||
              data.head_sha?.toLowerCase() !== headSha.toLowerCase() ||
              data.status !== "in_progress"
            ) {
              throw new Error("GitHub did not start release-policy on the pull request head SHA.");
            }
            core.setOutput("check_run_id", String(data.id));
            core.setOutput("head_sha", headSha);
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
      - name: Refuse stale base code after main advances
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate promotion or stable metadata from trusted base code
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-promotion-policy.mjs
      - name: Complete source-bound release-policy check
        if: ${{ always() && steps.policy_check.outputs.check_run_id != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_POLICY_CHECK_RUN_ID: ${{ steps.policy_check.outputs.check_run_id }}
          RELEASE_POLICY_OUTCOME: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;
            const headSha = pullRequest?.head?.sha;
            const checkRunId = Number(process.env.RELEASE_POLICY_CHECK_RUN_ID);
            let conclusion = process.env.RELEASE_POLICY_OUTCOME === "success" ? "success" : "failure";
            let finalVerificationFailure = "";
            if (
              !Number.isSafeInteger(checkRunId) ||
              checkRunId <= 0 ||
              !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/iu.test(String(headSha || ""))
            ) {
              throw new Error("Cannot complete release-policy without its source-bound check run and PR head SHA.");
            }
            if (conclusion === "success") {
              const { spawnSync } = require("node:child_process");
              const verification = spawnSync(
                process.execPath,
                ["scripts/release-promotion-policy.mjs", "--revalidate-beta-tag"],
                { encoding: "utf8", windowsHide: true },
              );
              if (verification.error || verification.status !== 0) {
                finalVerificationFailure = String(
                  verification.error?.message ||
                  verification.stderr?.trim() ||
                  verification.stdout?.trim() ||
                  `exit code ${verification.status}`,
                );
                conclusion = "failure";
              }
            }
            const { data } = await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunId,
              status: "completed",
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: `Trusted release policy ${conclusion}`,
                summary: conclusion === "success"
                  ? "The base-owned release policy accepted this pull request head."
                  : finalVerificationFailure
                    ? `Final release-policy revalidation failed: ${finalVerificationFailure}`
                    : "The base-owned release policy failed. See the trusted workflow log for details.",
              },
            });
            if (
              data.id !== checkRunId ||
              data.name !== "release-policy" ||
              data.head_sha?.toLowerCase() !== headSha.toLowerCase() ||
              data.status !== "completed" ||
              data.conclusion !== conclusion
            ) {
              throw new Error("GitHub did not complete release-policy on the pull request head SHA.");
            }
            if (finalVerificationFailure) {
              core.setFailed(`Final release-policy revalidation failed: ${finalVerificationFailure}`);
            }
