<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#202020"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f3f3f3"
      media="(prefers-color-scheme: light)"
    />
    <title>Zinnia: Debug Console</title>
    <link rel="stylesheet" href="/debug-console.css" />
  </head>
  <body>
    <div id="titlebar" data-tauri-drag-region>
      <div class="titlebar-logo" data-tauri-drag-region>
        <img
          src="/zinnia_default-logo.png"
          class="titlebar-icon"
          data-tauri-drag-region
          alt=""
        />
        <span class="titlebar-text" data-tauri-drag-region>Debug Console</span>
      </div>
      <div id="titlebar-controls">
        <button class="titlebar-btn" id="titlebar-min" aria-label="Minimize">
          <svg width="10" height="1" viewBox="0 0 10 1">
            <rect width="10" height="1" fill="currentColor" />
          </svg>
        </button>
        <button class="titlebar-btn" id="titlebar-max" aria-label="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <rect
              width="9"
              height="9"
              x="0.5"
              y="0.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        </button>
        <button
          class="titlebar-btn titlebar-btn--close"
          id="titlebar-close"
          aria-label="Close"
        >
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path
              d="M0.5,0.5 L9.5,9.5 M9.5,0.5 L0.5,9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        </button>
      </div>
    </div>

    <main class="debug-console-window">
      <div class="debug-console-window__header">
        <h1 class="debug-console-window__title">Debug Console</h1>
        <div class="debug-console-window__actions">
          <button type="button" class="btn btn--ghost btn--sm" id="dbg-clear">
            Clear
          </button>
          <button type="button" class="btn btn--ghost btn--sm" id="dbg-copy">
            Copy
          </button>
          <button type="button" class="btn btn--ghost btn--sm" id="dbg-dock">
            Dock
          </button>
        </div>
      </div>
      <pre
        class="debug-console-window__log"
        id="dbg-log"
        role="log"
        aria-live="polite"
      ></pre>
    </main>

    <script type="module" src="/debug-console-window.ts"></script>
  </body>
</html>
